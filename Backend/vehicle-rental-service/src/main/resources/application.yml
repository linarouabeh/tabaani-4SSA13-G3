server:
  port: 8082

spring:
  application:
    name: VEHICLE-RENTAL-SERVICE
  datasource:
    # XAMPP MySQL : base vehicle_rental_db, utilisateur root par défaut.
    # Variables facultatives : DB_URL, DB_USERNAME, DB_PASSWORD.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/vehicle_rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/,http://localhost:8762/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers,configprops,threaddump
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Vehicle Rental Service
    description: Microservice Location de voitures - Tabaani (4SSA13 - Groupe 3)
    version: 1.0.0
    author: Mohamed Gharsa
