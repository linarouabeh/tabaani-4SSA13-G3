# Application
spring.application.name=RECLAMATION-SERVICE
server.port=8086

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reclamation_db
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Reclamation Service
info.app.version=1.0.0
info.app.description=Gestion des reclamations
eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true