spring.application.name=covoiturage-service
server.port=8082

# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tabaani_covoiturage
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Configuration JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Covoiturage
info.app.version=1.0.0
info.app.description=Microservice Covoiturage Tabaani


# Eureka Client
eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Envoyer le statut de sante Actuator a Eureka
eureka.client.healthcheck.enabled=true
