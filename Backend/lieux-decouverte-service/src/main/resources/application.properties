# Identité du microservice
spring.application.name=lieux-decouverte-service
server.port=8080

# Base PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tabaani_lieux
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Client Eureka : deux serveurs prévus
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/,http://localhost:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Observabilité Actuator pour les essais locaux
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informations du service
info.app.name=Lieux et Decouverte
info.app.version=1.0.0
info.app.description=Gestion des lieux, categories, tags, photos et avis
info.app.team=Tabaani - Groupe 3

# Transmettre la santé du service à Eureka
eureka.client.healthcheck.enabled=true