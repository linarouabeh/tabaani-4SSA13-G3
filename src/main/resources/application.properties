# Application
spring.application.name=ms6-paiements
server.port=8086

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3307/tabaani_paiements?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yassinebelhout
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client
eureka.client.service-url.defaultZone=http://peer1:8761/eureka/,http://peer2:8762/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application Information
management.info.env.enabled=true

info.app.name=MS6 - Paiements
info.app.description=Microservice de gestion des paiements du projet TABAANI
info.app.version=1.0.0
info.app.team=TABAANI